<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root runs the System Manager; anyone may ask it, and it asks polkit. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.nyxos_project.System"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.nyxos_project.System"/>
  </policy>
</busconfig>
