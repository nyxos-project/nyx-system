# The NyxOS software catalog, shared by Nyx Welcome, Nyx Store and `nyx-system catalog`.
#
# tier: "base" is preinstalled, "welcome" is offered in Welcome (and the Store), "store"
# only in the Store. An item installs any of: nixpkgs `packages` (for everyone, through
# the System Manager), `nyx` apps (nyx.<name>.enable), a Flathub `flatpak` (for the
# user), and turns on `services`. `groups` are joined by the user who asks, only after
# they agree; `unfree` items need their license accepted. `bin` is a command that shows
# the item is already installed, however it got there.

[[section]]
id = "nyx-apps"
name = "Nyx apps"
summary = "Mail, calendar, notes and the rest of the Nyx suite."

[[section]]
id = "desktop"
name = "Apps"
summary = "Browsers, office, creative tools, games and chat."

[[section]]
id = "cli"
name = "Command-line tools"
summary = "Terminal tools and text-mode apps."

[[section]]
id = "toolchains"
name = "Development"
summary = "Languages and build tools. Projects can also bring their own with Nix shells."

[[section]]
id = "infrastructure"
name = "Containers and infrastructure"
summary = "Containers, virtual machines, networking, sync and cloud tools."

[[section]]
id = "agents"
name = "AI agents"
summary = "Coding agents and local models. Installing one doesn't give it access to Nyx Assistant or to system changes."

