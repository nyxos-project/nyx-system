[package]
name = "nyx-config"
description = "NyxOS's configuration layers: distribution defaults, system overrides and user settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Store::watch, on inotify.
watch = ["dep:notify"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
