[workspace]
resolver = "3"
members = ["crates/nyx-config", "crates/nyx-system-proto", "crates/nyx-catalog", "crates/nyx-update", "apps/system-manager", "apps/system-cli", "apps/themed", "apps/recovery"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-system"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time", "io-util", "signal"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# The theme engine (nyx-design) takes nyx-config from this repository by git; here it's
# this checkout's, so the programs carry one copy.
[patch."https://github.com/nyxos-project/nyx-system.git"]
nyx-config = { path = "crates/nyx-config" }
